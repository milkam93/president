<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>태어난 김에 대통령까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fa; --grid:#dbe5f2; --paper:#ffffff; --ink:#1b2433; --muted:#667185; --line:#d5deeb;
  --chip:#e8eef7; --blue:#1f4fa3; --red:#d23b33; --gold:#b98a1e; --good:#23804f; --bad:#c13a32; --pink:#c2508a;
  --goodbg:#e2f3e9; --badbg:#fbe5e3; --btntx:#ffffff; --shadow:0 1px 0 rgba(27,36,51,.06),0 10px 30px rgba(31,79,163,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1624; --grid:#17233a; --paper:#152036; --ink:#e7edf7; --muted:#9aa7bd; --line:#26344f;
    --chip:#1d2a44; --blue:#86abf2; --red:#ff7166; --gold:#e6b955; --good:#6fd29a; --bad:#ff8a80; --pink:#f08bbf;
    --goodbg:#163327; --badbg:#3a1d1f; --btntx:#0e1624; --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1624; --grid:#17233a; --paper:#152036; --ink:#e7edf7; --muted:#9aa7bd; --line:#26344f;
  --chip:#1d2a44; --blue:#86abf2; --red:#ff7166; --gold:#e6b955; --good:#6fd29a; --bad:#ff8a80; --pink:#f08bbf;
  --goodbg:#163327; --badbg:#3a1d1f; --btntx:#0e1624; --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;-webkit-font-smoothing:antialiased}
.dh{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
#app{max-width:720px;margin:0 auto;padding:18px 14px 70px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:var(--shadow)}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--blue);color:var(--btntx);border:0;border-radius:12px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{display:block;margin-top:10px;font-size:13.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px}
b.ok{color:var(--good)} b.no{color:var(--bad)}

/* 타이틀 */
.title{text-align:center;padding:40px 22px 34px}
.emblem{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;position:relative;transform:rotate(-33deg);
  background:linear-gradient(180deg,var(--red) 50%,var(--blue) 50%)}
.emblem::before,.emblem::after{content:'';position:absolute;width:46px;height:46px;border-radius:50%;top:23px}
.emblem::before{left:0;background:var(--red)}
.emblem::after{left:46px;background:var(--blue)}
.title h1{margin:0;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(40px,10vw,64px);line-height:1.08}
.title h1 span{display:block;font-size:.62em;color:var(--muted)}
.title p{color:var(--muted);max-width:30em;margin:16px auto 26px}
.tbtns{display:grid;gap:10px;max-width:300px;margin:0 auto}
.meta{font-size:12.5px;color:var(--muted);margin-top:22px}

/* 캐릭터 생성 */
.field{margin:18px 0}
.field label{display:block;font-weight:700;margin-bottom:8px}
.nrow{display:flex;gap:8px}
.nrow input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt.on{border-color:var(--blue);background:var(--chip)}

/* HUD */
#hud{margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-top:8px;margin-top:-8px}
#hud:not(:empty)~#logbox{margin-top:0}
body:has(#hud:not(:empty))::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
@media (max-width:560px){#hud .card{padding:12px 14px!important}#hud .lifebar{margin:8px 0 6px}#hud .chips{gap:4px}#hud .chip{font-size:12px;padding:2px 8px}#hud .bars{margin-top:8px}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.who .nm{font-family:'Do Hyeon',sans-serif;font-size:26px;line-height:1.1}
.who .sg{color:var(--muted);font-size:14px}
.age{font-family:'Do Hyeon',sans-serif;font-size:46px;line-height:.9;color:var(--blue);white-space:nowrap}
.age small{font-size:18px;margin-left:2px}
.lifebar{height:5px;background:var(--chip);border-radius:9px;margin:12px 0 10px;overflow:hidden}
.lifebar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red));border-radius:9px;transition:width .8s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;white-space:nowrap}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.bar .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:2px}
.bar .l b{color:var(--ink)}
.bar .t{height:7px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:2px}
.bar .f{height:100%;border-radius:9px;transition:width .6s}

/* 이벤트 */
.ev{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.ev .head{display:flex;align-items:center;gap:12px}
.ev .ic{font-size:38px;line-height:1}
.tag{display:inline-block;font-size:12.5px;color:var(--red);border:1.5px solid currentColor;border-radius:6px;padding:0 8px;font-weight:700}
.ev h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:28px;line-height:1.2;margin:4px 0 0}
.ev .tx{font-size:16.5px;margin-top:14px}
.choices{display:grid;gap:10px;margin-top:20px}
.cbtn{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px 13px 46px;color:var(--ink);cursor:pointer;font-size:15.5px;line-height:1.5}
.cbtn::before{content:'';position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;border:1.5px dashed var(--line);border-radius:50%}
.cbtn:hover:not(.lock){border-color:var(--blue)}
.cbtn:hover:not(.lock)::before{border-color:var(--red)}
.cbtn.lock{opacity:.5;cursor:not-allowed}
.cbtn .rq{display:block;font-size:12.5px;color:var(--bad);margin-top:2px}
.cbtn.stamp::before{border:2.5px solid var(--red);border-style:solid;background:radial-gradient(circle,transparent 45%,transparent 46%);animation:stamp .28s ease-out}
.cbtn.stamp::after{content:'卜';position:absolute;left:14px;top:50%;width:20px;margin-top:-11px;text-align:center;color:var(--red);font-weight:900;font-size:14px;animation:stamp .28s ease-out}
@keyframes stamp{from{transform:scale(1.8);opacity:0}}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.d{font-size:13.5px;font-weight:700;border-radius:8px;padding:3px 10px}
.d.up{color:var(--good);background:var(--goodbg)}
.d.dn{color:var(--bad);background:var(--badbg)}
.next{margin-top:22px;display:flex;justify-content:flex-end}

/* 시간 배분 */
.fl{display:grid;gap:8px;margin-top:16px}
.frow{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.frow.has{border-color:var(--blue);background:var(--chip)}
.frow.lock{opacity:.45}
.frow .fi{font-size:24px;text-align:center}
.frow .fn b{display:block;font-size:15.5px}
.frow .fn span{font-size:12.5px;color:var(--muted)}
.fc{display:flex;align-items:center;gap:8px}
.mini{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
.mini:disabled{opacity:.35;cursor:not-allowed}
.cnt{min-width:16px;text-align:center;font-weight:900;font-size:17px}
.fbot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--red)}
.dots i.on{background:var(--red)}
.fin{margin-top:10px;font-size:14px;color:var(--muted)}

/* 투표 막대 */
.votes{margin-top:16px;display:grid;gap:10px}
.vr{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;font-size:14px}
.vr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt{height:22px;background:var(--chip);border-radius:6px;overflow:hidden}
.vf{height:100%;width:var(--w);animation:grow 1.6s cubic-bezier(.2,.8,.2,1)}
.vf.me{background:var(--blue)} .vf.op{background:var(--muted)}
@keyframes grow{from{width:0}}

/* 기록 */
#logbox{margin-top:16px}
.logc{padding:18px 20px}
.logc h3{margin:0 0 8px;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px}
.lg{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;padding:5px 0;border-top:1px dashed var(--line)}
.lg .a{color:var(--muted);font-weight:700}
.lg.imp .t{font-weight:700;color:var(--blue)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:6px 0;font-size:14px;font-weight:700}

/* 엔딩 */
.end{text-align:center}
.end .big{font-size:64px;line-height:1}
.end h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(32px,8vw,46px);line-height:1.15;margin:10px 0 4px}
.end .sub{color:var(--muted)}
.end .desc{text-align:left;margin-top:18px;font-size:16px}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;text-align:left}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:500}
.sec{margin-top:24px;text-align:left}
.sec h3{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:21px;margin:0 0 6px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.dex div{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px}
.dex div.lock{color:var(--muted);border-style:dashed}
.dex .e{font-size:30px;display:block}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
@media (max-width:520px){
  .card{padding:20px 16px}
  .bars{gap:5px}
  .bar .l{font-size:11px}
  .ev h2{font-size:24px}
  .age{font-size:38px}
}

/* 관찰자 모드 */
#logbox{margin-top:0}
#focus{margin-top:14px}
#main:empty{display:none}
#main{margin-top:14px}
#hud:empty,#logbox:empty,#focus:empty{display:none}
#logbox:not(:empty){margin-bottom:0}
.agebox{text-align:right}
.mo{font-size:13px;color:var(--muted);margin-top:4px}
.live{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--good);margin-left:6px;vertical-align:middle}
.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;animation:blink 1.6s infinite}
.live.off{color:var(--muted)} .live.off::before{animation:none}
@keyframes blink{50%{opacity:.25}}
.lgl{max-height:260px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.lg.new{animation:logIn .6s ease-out}
@keyframes logIn{from{opacity:0;transform:translateY(-6px);background:var(--chip)}}
.lg.f .t{color:var(--muted)}
.lg.y{border-top:1.5px solid var(--line);margin-top:4px}
.lg.y .t{font-weight:700;color:var(--red)}
.lg.a .t b{color:var(--ink)}
.ld{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 6px;margin:1px 2px 0 0}
.ld.up{color:var(--good);background:var(--goodbg)} .ld.dn{color:var(--bad);background:var(--badbg)}
.fcard{padding:18px 20px}
.fcard h3{margin:0;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px}
.fcard h3 small{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--muted);margin-left:4px}
.fhint{margin:2px 0 12px;font-size:13.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fchip{display:flex;align-items:center;gap:8px;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.fchip .fi{font-size:22px}
.fchip b{display:block;font-size:14.5px;line-height:1.3}
.fchip small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.fchip.on{border-color:var(--blue);background:var(--chip);box-shadow:inset 0 0 0 1px var(--blue)}
.fchip:disabled{opacity:.4;cursor:not-allowed}
.fchip:not(:disabled):hover{transform:translateY(-1px)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn.sm{padding:8px 14px;font-size:14px}
.spd{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.sbtn{background:var(--paper);color:var(--muted);border:0;padding:7px 11px;font-size:13px;cursor:pointer}
.sbtn.on{background:var(--blue);color:var(--btntx);font-weight:700}
@media (max-width:560px){.fgrid{grid-template-columns:repeat(2,1fr)}.fchip small{display:none}.lgl{max-height:200px}}

/* 팝업 */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#modal.show{display:flex}
.mbk{position:absolute;inset:0;background:rgba(9,16,30,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadeIn .35s ease-out}
.mcard{position:relative;width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:popIn .45s cubic-bezier(.18,.9,.22,1.12)}
.mcard .swap{animation:swapIn .4s ease-out}
.mcard .tx{font-size:16.5px;margin-top:14px}
.mcard h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:27px;line-height:1.2;margin:4px 0 0}
.mcard .head{display:flex;align-items:center;gap:12px}
.mcard .ic{font-size:38px;line-height:1}
.mage{font-size:12.5px;color:var(--muted);margin-bottom:10px}
#modal.hide .mbk{animation:fadeOut .3s forwards}
#modal.hide .mcard{animation:popOut .3s forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.94)}}
@keyframes popOut{to{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes swapIn{from{opacity:0;transform:translateX(14px)}}

/* 인생 돌아보기 */
#flash{position:fixed;inset:0;z-index:70;display:none;color:#eef2fa;
  --blue:#86abf2;--red:#ff7166;--gold:#e6b955;--good:#6fd29a;--pink:#f08bbf}
#flash.show{display:block}
#flash.hide{animation:fadeOut .6s forwards}
.fbg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#1c2b4a 0%,#0a111f 70%);animation:fadeIn .8s}
.fstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.fx{max-width:520px;width:100%;text-align:center;animation:flick 2.3s ease-in-out both}
@keyframes flick{0%{opacity:0;transform:scale(.96) translateY(14px);filter:blur(6px)}18%{opacity:1;transform:none;filter:none}82%{opacity:1;filter:none}100%{opacity:0;transform:scale(1.03) translateY(-10px);filter:blur(4px)}}
.fage{font-family:'Do Hyeon',sans-serif;font-size:clamp(64px,18vw,110px);line-height:1;color:#86abf2}
.fage small{font-size:.35em;margin-left:4px;color:#9aa7bd}
.ftxt{font-size:clamp(19px,4.6vw,24px);font-weight:700;margin-top:14px;line-height:1.5}
.fbig{font-family:'Do Hyeon',sans-serif;font-size:clamp(48px,13vw,84px);line-height:1.1}
.fsub{color:#9aa7bd;font-size:17px;margin:6px 0}
.fout .emblem{margin-bottom:22px}
.fbars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:26px;font-size:12px;color:#9aa7bd}
.fbars .ft{display:block;height:5px;background:rgba(255,255,255,.12);border-radius:5px;margin-top:4px;overflow:hidden}
.fbars i{display:block;height:100%;border-radius:5px;animation:grow 1.4s ease-out}
.fskip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.1);color:#eef2fa;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer}
.fprog{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:3px;background:rgba(255,255,255,.08)}
.fprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#86abf2,#ff7166);transition:width .6s}


/* 직접 고르는 활동 */
#acts{margin-top:14px}
#acts:empty{display:none}
.atabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.atab{background:var(--chip);color:var(--ink);border:1.5px solid transparent;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.atab.on{background:var(--paper);border-color:var(--blue);color:var(--blue);font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.abtn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,transform .2s}
.abtn:not(.lock):hover{border-color:var(--blue);transform:translateY(-1px)}
.abtn.lock{opacity:.55;cursor:not-allowed}
.abtn .ai{font-size:22px}
.abtn .an{flex:1;min-width:0}
.abtn b{display:block;font-size:14.5px;line-height:1.3}
.abtn small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.abtn .ac{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
@media (max-width:560px){.agrid{grid-template-columns:1fr}.sbtn{padding:7px 8px}}
.pxc{display:block;width:min(400px,84vw);aspect-ratio:16/9;margin:0 auto 18px;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.4)}
.fx .fage{font-size:clamp(40px,12vw,64px)}
.tbl td.better{color:var(--good);font-weight:700}
.tbl td.worse{color:var(--bad);font-weight:700}

.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.pstep{background:var(--chip);border-radius:10px;padding:5px 10px;font-size:14px;font-weight:700}

function N(j){const n=S.name,c=n.charCodeAt(n.length-1),b=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;
  const m={'이':['이','가'],'은':['은','는'],'을':['을','를'],'과':['과','와']};const p=m[j];return n+(p?(b?p[0]:p[1]):'')}
function won(v){v=Math.round(v);const s=v<0?'-':'';v=Math.abs(v);if(v>=10000){const e=Math.floor(v/10000),r=v%10000;return s+e+'억'+(r?' '+r.toLocaleString()+'만':'')+'원'}return s+v.toLocaleString()+'만원'}
function fx(o){for(const k in o){const v=Math.round(o[k]);if(!v)continue;
  if(k==='money'){S.money=Math.round(S.money+v);PEND.push([k,v]);continue}
  const t=(k==='fame'||k==='network')?S:S.st,b=t[k],nv=Math.max(0,Math.min(100,b+dim(v,b)));t[k]=nv;
  const d=Math.round(nv)-Math.round(b);if(d)PEND.push([k,d])}if(S.money<0)normMoney()}
function dim(v,b){if(v<=0)return v;const m=b<45?1:Math.max(.2,1-(b-45)/62);return Math.max(1,Math.round(v*m))}
function lg(t,imp,c){const e={a:S.age,t,imp:!!imp};if(c)e.c=c;if(imp)e.s=STATS.map(k=>Math.round(S.st[k]));S.log.push(e);
  if(S.log.length>900){const i=S.log.findIndex(x=>x.c==='f');if(i>=0)S.log.splice(i,1)}if(typeof addLog==='function')addLog(e)}
function assets(){return S.money+(S.house||0)-(S.loan||0)}
function normMoney(){if(S.money<0){const d=-Math.round(S.money);S.loan=(S.loan||0)+d;S.money=0;lg(`모자란 돈 ${won(d)}을 대출로 메웠다.`,0,'f')}}

  vote4:{q:'반장 선거에서 “성적 상위 5명은 2표씩 행사한다”고 정했다. 어떤 선거 원칙에 어긋날까?',o:['보통선거','평등선거','직접선거','비밀선거'],a:1,e:'평등선거는 누구나 똑같이 1인 1표를 행사하는 원칙이에요. 대한민국 헌법은 보통·평등·직접·비밀선거의 4대 원칙을 정하고 있습니다.'},

function quizReward(k){const d=QDIFF[k]||2;S.qstreak=(S.qstreak||0)+1;const r=Object.assign({},QREW[d]);
  const sb=Math.min(4,S.qstreak-1);if(sb>0){r.civic+=sb;r.intel+=Math.ceil(sb/2)}
  const perfect=S.qc===S.qt&&S.qt>=3;if(perfect){for(const k2 in r)r[k2]=Math.round(r[k2]*1.5)}
  for(const k2 in r){const t=k2==='fame'?S:S.st,b=t[k2];t[k2]=Math.min(100,b+r[k2]);const dlt=Math.round(t[k2])-Math.round(b);if(dlt)PEND.push([k2,dlt])}
  return`<span class="qbonus">${'★'.repeat(d)} 난이도 보상${sb>0?` · 🔥 ${S.qstreak}연속 정답 보너스`:''}${perfect?' · 👑 전부 정답 가중 ×1.5':''}</span>`}

    EL.bonus+=.1;S.scandal++}
  EL.bonus+=partyBonus(k);if(EL.spent)S.money+=EL.spent;const p=Math.max(.04,Math.min(k==='pres'?.55:.85,.5+(power()-c.diff)/32+EL.bonus));const win=ch(p);

  const html=voteBars(my,opp);

    return{t:`<b>당선!</b> ${c.seat} 배지를 달았다. 이제 유권자에게 한 약속을 지킬 차례다.`,html,chain:[qz(c.q)]}}

 choices:[

  {t:'방학에만 일한다',fn:()=>{S.pt='vacation';return'학기 중에는 공부, 방학에는 아르바이트로 균형을 잡았다.'}},

  {t:'허리띠를 졸라매고 일을 늘린다',fn:()=>{S.flags.debtAt=S.age;const g=Math.round(S.loan*.2);S.loan-=g;fx({happy:-4,health:-3});return`외식을 끊고 주말에도 일했다. 2년 동안 ${won(g)}을 갚았다.`}},

{id:'army',when:()=>S.age===20&&S.gender==='m',icon:'🪖',tag:'국방의 의무',title:'입영 통지서',text:'집으로 입영 통지서가 날아왔다. 대한민국 남성은 헌법과 병역법에 따라 병역의 의무를 진다. 어디에서 복무할까?<span class="note">💡 복무 기간은 육군·해병대 18개월, 해군 20개월, 공군 21개월이에요.</span>',choices:[

  {t:'해군에 지원한다 (20개월)',fn:()=>{enlist('해군',20/12);fx({civic:2,health:1});return{t:'함정 근무를 지원했다. 바다 위에서 20개월을 보낸다.',chain:[qz('duty','국민의 의무')]}}},
  {t:'공군에 지원한다 (21개월)',fn:()=>{enlist('공군',21/12);fx({civic:2,intel:1});return{t:'공군 기술병으로 선발됐다. 복무는 조금 길지만 전문 기술을 배울 수 있다.',chain:[qz('duty','국민의 의무')]}}},
  {t:'카투사(주한미군 배속 한국군)에 지원한다',req:()=>S.st.intel>=55,rq:'지능 55 이상(어학 성적)',fn:()=>{if(ch(.3)){enlist('카투사',1.5);fx({social:2,intel:2});return{t:'추첨에 뽑혔다! 영어와 다른 문화를 배우며 복무하게 됐다.',chain:[qz('duty','국민의 의무')]}}
    enlist('육군',1.5);return{t:'추첨에서 떨어져 육군 현역으로 입대했다.',chain:[qz('duty','국민의 의무')]}}},
 ]},
{id:'cancer',p:()=>.012+(S.st.health<40?.012:0),when:()=>S.age>=45&&S.age<60&&!S.flags.cancer,icon:'🏥',tag:'건강',title:'뜻밖의 진단',

    return early?'초기에 발견해 수술이 잘 끝났다. 정기 검진이 생명을 구했다.':'긴 항암 치료가 이어졌다. 가족의 손을 잡고 버텼다.'}},
  {t:'일을 줄이고 가족 곁에서 치료한다',fn:()=>{const early=S.flags.checkup!==undefined&&S.age-S.flags.checkup<=2;S.flags.cancer=early?1:2;fx({health:-10,happy:2,money:-1000});S.xp=Math.max(0,S.xp-3);lg('암 진단, 치료 시작',1);

 ]},

 ]},

function elecNotice(){const map={pres:'runPres',assembly:'runAsm',local:'runLocal'};
  for(const k of ['pres','assembly','local']){const a=ACTS.find(x=>x.id===map[k]);if(a.show&&!a.show())continue;if(!actState(a).ok)continue;
    const keen=k==='pres'||S.flags.nominated||S.flags.party||S.pol>0||S.polOpen||(S.job&&['politics','ngo'].includes(S.job.track))||S.st.civic>=55;if(!keen)continue;
    return Object.assign(elecDecide(k),{when:()=>S.lastElec[k]!==S.age&&nextElec(k)===0})}return null}
function termName(){const t=S.terms||1;return t===1?'초선 ':t===2?'재선 ':t+'선 '}
function reelect(adj,label,extra){S.lastElec.assembly=S.age;const p=Math.max(.15,Math.min(.88,.5+(power()-ELEC.assembly.diff)/32+.1+adj-S.scandal*.1));
  const win=ch(p),my=win?50+R(1,10):50-R(1,12),html=voteBars(my,100-my-R(1,3));
  if(win){S.terms=(S.terms||1)+1;fx(Object.assign({fame:5,network:4,happy:6},extra||{}));lg(`${label}, ${S.terms===2?'재선':S.terms+'선'} 성공 (득표율 ${my}%)`,1);

  S.flags.exMP=true;fx({fame:-4,happy:-8});lg(`${label} 낙선 (득표율 ${my}%)`,1);return{t:'아쉽게 낙선했다. 이제 ‘전 국회의원’이다. 다음 총선에서 다시 도전할 수 있다.',html}}

function actState(a){if(S.flags.military&&!a.mil)return{ok:false,why:'군 복무 중에는 할 수 없어요'};
  if(S.epi&&a.cat==='pol'&&!(a.id==='runPres'&&S.pol>=2&&S.age<=75))return{ok:false,why:'은퇴 후에는 쉬어요'};
  if(a.req&&!a.req())return{ok:false,why:a.rq()};
  const l=a.cd?cdLeft(a):0;if(l>0)return{ok:false,why:`${l<1?Math.max(1,Math.ceil(l*12))+'개월':Math.ceil(l)+'년'} 뒤 다시 할 수 있어요`};
  const c=costOf(a);if(c>S.money)return{ok:false,why:`현금이 부족해요 (${won(c)} 필요)`};return{ok:true}}
function actEvent(a){const c=costOf(a);
  const chs=a.choices?a.choices(a):[{t:c?`${won(c)}을 쓰고 한다`:'한다',fn:()=>{pay(a,c);return a.run()}},{t:'다음에 할게요',fn:()=>'다음 기회에 하기로 했다.'}];
  return{icon:a.icon,tag:'직접 고른 활동',title:nm(a),text:(a.text?(typeof a.text==='function'?a.text():a.text):a.desc)+(c?`<span class="note">비용 ${won(c)}, 현재 자산 ${won(S.money)}</span>`:''),choices:chs}}
function renderActs(){const el=$('#acts');if(!S||ENDING){el.innerHTML='';ACTSIG='';return}
  const cats=[['money','💸 돈 쓰기'],['pol','🏛️ 정치·사회'],['self','🌿 나를 가꾸기'],['gloss','📖 용어 사전']];
  if(ACTCAT==='gloss'){if(ACTSIG==='gloss')return;ACTSIG='gloss';el.innerHTML=`<div class="card fcard"><h3>🗂️ 직접 고르는 활동</h3><p class="fhint">게임에 나오는 어려운 정치 용어를 찾아볼 수 있어요.</p><div class="atabs" role="tablist">${cats.map(([k,n])=>`<button role="tab" class="atab ${ACTCAT===k?'on':''}" data-c="${k}" aria-selected="${ACTCAT===k}">${n}</button>`).join('')}</div>${glossHtml()}</div>`;
    document.querySelectorAll('.atab').forEach(b=>b.onclick=()=>{ACTCAT=b.dataset.c;ACTSIG='';renderActs()});bindGloss();return}
  const list=ACTS.filter(a=>a.cat===ACTCAT&&(!a.show||a.show())).map(a=>({a,s:actState(a)}));
  const sig=ACTCAT+'|'+list.map(x=>x.a.id+x.s.ok+(x.s.why||'')+costOf(x.a)).join();if(sig===ACTSIG)return;ACTSIG=sig;
  el.innerHTML=`<div class="card fcard"><h3>🗂️ 직접 고르는 활동</h3><p class="fhint">언제든 골라서 할 수 있어요. 활동을 고르는 동안 시간은 멈춥니다. 나이가 들고 자산이 늘수록 씀씀이와 비용도 커져요.</p>
    <div class="atabs" role="tablist">${cats.map(([k,n])=>`<button role="tab" class="atab ${ACTCAT===k?'on':''}" data-c="${k}" aria-selected="${ACTCAT===k}">${n}</button>`).join('')}</div>
    <div class="agrid">${list.map(({a,s})=>{const c=costOf(a);return`<button class="abtn ${s.ok?'':'lock'}" data-a="${a.id}" ${s.ok?'':'aria-disabled="true"'}><span class="ai">${a.icon}</span><span class="an"><b>${nm(a)}</b><small>${s.ok?a.desc:'🔒 '+s.why}</small></span>${c?`<span class="ac">${won(c)}</span>`:''}</button>`}).join('')}</div></div>`;
  document.querySelectorAll('.atab').forEach(b=>b.onclick=()=>{ACTCAT=b.dataset.c;ACTSIG='';renderActs()});
  document.querySelectorAll('.abtn').forEach(b=>b.onclick=()=>{if(MODAL||ENDING||b.classList.contains('lock'))return;const a=ACTS.find(x=>x.id===b.dataset.a);if(!actState(a).ok)return;openModal(a.open?a.open():actEvent(a))})}

function frame(ts){if(!S||ENDING){RAF=null;return}const dt=LAST?Math.min(250,ts-LAST):0;LAST=ts;
  const ready=S.epi||S.focus.length>0;
  if(!PAUSED&&!MODAL&&ready&&dt>0){const dy=dt*SPEED/(S.epi?OLD_MS:YEAR_MS);S.yf+=dy;if(!S.epi)applyFocus(dy);decay(dy);
    ptTick(dy);milTick();
    while(!MODAL&&!ENDING&&SCHED.length&&S.yf>=SCHED[0].at)fire(SCHED.shift().e);

function sceneFor(t){t=strip(t);

  if(/반장|학생회장/.test(t))return'class';
  if(/당선/.test(t))return'win';
  if(/전역/.test(t))return'armyout';
  if(/입대|복무|카투사|대민/.test(t))return'army';
  if(/연애|설렘/.test(t))return'love';
  if(/결혼/.test(t))return'wedding';
  if(/출산|부모가 됨|아이/.test(t))return'baby';
  if(/아파트|내 집|청약/.test(t))return'house';
  if(/투표/.test(t))return'vote';
  if(/입학|합격|진학|졸업|자격증/.test(t))return'school';
  if(/취업|입사|사회생활|채용|입문|개업|창업|보좌/.test(t))return'office';
  if(/승진|자리에 오름|성장|임명|재선|위원장|입당/.test(t))return'promo';
  if(/여행|교환학생|해외|은퇴/.test(t))return'travel';
  if(/신호등|청원|노동조합|봉사|활동|모의국회|시민단체|기부|신고|출판/.test(t))return'sign';
  if(/영면|손주|자서전|60세|황혼/.test(t))return'old';
  if(/수능|재수|시험|책|은사/.test(t))return'study';

  return'walk'}
function pxSky(c,top,bot){for(let y=0;y<90;y++){const r=y/89;c.fillStyle=`rgb(${Math.round(top[0]+(bot[0]-top[0])*r)},${Math.round(top[1]+(bot[1]-top[1])*r)},${Math.round(top[2]+(bot[2]-top[2])*r)})`;c.fillRect(0,y,160,1)}}
function pxPerson(c,x,y,o){o=o||{};const k=o.skin||'#f2c29b',h=o.hair||'#2b1d14',s=o.shirt||'#3b6fd6',p=o.pants||'#26324a';
  x=Math.round(x);const by=Math.round(y-(o.jump||0));const lg_=o.walk?Math.floor((o.f||0)/6)%2:0;
  c.fillStyle=p;c.fillRect(x-3,by-5,2,5-lg_);c.fillRect(x+1,by-5,2,4+lg_);
  c.fillStyle=s;c.fillRect(x-3,by-11,6,6);
  if(o.arms==='up'){c.fillRect(x-5,by-15,2,5);c.fillRect(x+3,by-15,2,5);c.fillStyle=k;c.fillRect(x-5,by-16,2,1);c.fillRect(x+3,by-16,2,1)}
  else if(o.arms==='salute'){c.fillRect(x-5,by-11,2,5);c.fillRect(x+3,by-14,2,3);c.fillStyle=k;c.fillRect(x+2,by-16,3,2)}
  else if(o.arms==='wave'){const w=Math.floor((o.f||0)/8)%2;c.fillRect(x-5,by-11,2,5);c.fillRect(x+3,by-15+w,2,5);c.fillStyle=k;c.fillRect(x+3,by-16+w,2,1)}
  else{c.fillRect(x-5,by-11,2,5);c.fillRect(x+3,by-11,2,5);c.fillStyle=k;c.fillRect(x-5,by-6,2,1);c.fillRect(x+3,by-6,2,1)}
  c.fillStyle=k;c.fillRect(x-3,by-17,6,6);
  c.fillStyle=h;c.fillRect(x-3,by-18,6,2);c.fillRect(x-3,by-16,1,2);if(o.long){c.fillRect(x-4,by-17,1,6);c.fillRect(x+3,by-17,1,6)}
  c.fillStyle='#1b1b1b';const ey=o.sad?by-13:by-14;c.fillRect(x-2,ey,1,1);c.fillRect(x+1,ey,1,1);
  if(o.happy){c.fillStyle='#b5523b';c.fillRect(x-1,by-12,2,1)}
  if(o.tie){c.fillStyle='#c0392b';c.fillRect(x,by-11,1,4)}
  if(o.sash){c.fillStyle='#e6b955';for(let i=0;i<6;i++)c.fillRect(x-3+i,by-11+i,1,1)}
  if(o.bag){c.fillStyle='#6b4a2b';c.fillRect(x+4,by-7,4,3)}
  if(o.pack){c.fillStyle='#c0392b';c.fillRect(x-6,by-12,3,6)}
  if(o.hat){c.fillStyle=o.hat;c.fillRect(x-4,by-19,8,2);c.fillRect(x-3,by-20,6,1)}

function playScene(cv,type){if(PXRAF)cancelAnimationFrame(PXRAF);PXRAF=null;const c=cv&&cv.getContext?cv.getContext('2d'):null;if(!c)return;c.imageSmoothingEnabled=false;
  const fn=SCENES[type]||SCENES.walk;let f=0,last=0;const loop=ts=>{if(!cv.isConnected){PXRAF=null;return}if(ts-last>=50){last=ts;c.clearRect(0,0,160,90);try{fn(c,f)}catch(e){}f++}PXRAF=requestAnimationFrame(loop)};PXRAF=requestAnimationFrame(loop)}

function flashback(done){const f=$('#flash');let items=S.log.filter(e=>e.imp&&e.t!=='영면');
  if(items.length>18){const n=items.length,keep=[];for(let i=0;i<18;i++)keep.push(items[Math.round(i*(n-1)/17)]);items=keep}
  const frames=[{intro:1},...items,{outro:1}];let i=0,timer=null,stopped=false;
  f.innerHTML=`<div class="fbg"></div><div class="fstage" id="fst" aria-live="polite"></div><button class="fskip" id="fsk">건너뛰기</button><div class="fprog"><i id="fpi"></i></div>`;
  f.classList.remove('hide');f.classList.add('show');
  const finish=()=>{if(stopped)return;stopped=true;clearTimeout(timer);if(PXRAF)cancelAnimationFrame(PXRAF);PXRAF=null;f.classList.add('hide');setTimeout(()=>{f.classList.remove('show','hide');f.innerHTML='';done()},600)};
  const show=()=>{if(stopped)return;if(i>=frames.length){finish();return}const fr=frames[i];let html,dur=2900,scene=null;
    if(fr.intro){dur=2600;html=`<div class="fx fint"><div class="fsub">${S.flags.presWin?'대통령이 되기까지':'한 사람이 걸어온 길'}</div><div class="fbig">${S.name}의<br>인생 돌아보기</div></div>`}
    else if(fr.outro){dur=4200;scene=S.flags.presWin?'president':'old';html=`<div class="fx fout"><canvas class="pxc" width="160" height="90" aria-hidden="true"></canvas><div class="fbig">${S.flags.presWin?'대한민국 대통령':S.deathAge+'세'}</div><div class="fsub">${S.flags.presWin?`${S.age}세, ${S.name} 당선`:`${S.name}, 긴 여정을 마치다`}</div></div>`}
    else{scene=sceneFor(fr.t);html=`<div class="fx"><canvas class="pxc" width="160" height="90" aria-hidden="true"></canvas><div class="fage">${fr.a}<small>세</small></div><div class="ftxt">${strip(fr.t)}</div></div>`}
    $('#fst').innerHTML=html;const fx_=$('#fst .fx');fx_.style.animationDuration=dur+'ms';if(scene)playScene($('#fst canvas'),scene);
    i++;$('#fpi').style.width=(i/frames.length*100)+'%';timer=setTimeout(show,dur)};
  $('#fsk').onclick=finish;$('#fsk').focus({preventScroll:true});show()}

 ['정당','당 대표','정당을 대표하고 이끄는 사람이에요. 보통 전당대회에서 당원들이 뽑아요.'],
 ['정당','전당대회','정당의 가장 큰 회의로, 당 대표를 뽑거나 중요한 결정을 해요.'],
 ['정당','당직','당 대표, 최고위원, 대변인, 청년위원장처럼 정당 안에서 맡는 직책이에요.'],
 ['정당','계파','같은 정당 안에서 생각이나 가까운 사람을 중심으로 뭉친 작은 무리예요.'],
 ['정당','탈당과 창당','탈당은 정당에서 나오는 것, 창당은 새 정당을 만드는 것이에요.'],
 ['정당','싱크탱크','정책을 연구하고 아이디어를 내는 연구소예요.'],
 ['정당','킹메이커','자신이 직접 나서기보다 다른 사람을 대통령 등 높은 자리에 오르도록 돕는 사람이에요.'],
 ['정당','협치','서로 다른 정당이 힘을 합쳐 함께 나라 일을 풀어 가는 것이에요.'],
 ['법·권리','기본권','헌법이 보장하는 국민의 기본적인 권리예요. 평등권, 자유권, 참정권, 사회권, 청구권이 있어요.'],
 ['법·권리','청원권','국가기관에 문서로 의견이나 바라는 것을 낼 수 있는 권리예요.'],
 ['법·권리','공직선거법','선거를 공정하게 치르기 위한 규칙을 정한 법이에요. 돈 선거, 허위 사실 공표 등을 금지해요.'],
 ['법·권리','정치자금법','정치에 쓰이는 돈을 투명하게 관리하는 법이에요. 한 사람이 한 후원회에 낼 수 있는 후원금은 1년에 500만원까지예요.'],
 ['법·권리','이해충돌방지법','공직자가 일하면서 알게 된 비밀이나 권한을 이용해 자기나 가족의 이익을 챙기지 못하게 막는 법이에요.'],
 ['법·권리','명예훼손','사실이나 거짓 사실을 퍼뜨려 다른 사람의 평판을 떨어뜨리는 것으로, 처벌받을 수 있어요.'],
 ['법·권리','정정보도','언론 보도가 사실과 다를 때 바로잡는 기사를 내도록 요구하는 것이에요. 언론중재위원회에 신청할 수 있어요.'],
];
const GCATS=['전체','선거','국회','정부·사법','지방자치','정당','법·권리'];
let GCAT='전체';
function glossHtml(){return`<div class="gls"><input id="gq" placeholder="🔍 궁금한 용어를 찾아보세요 (예: 공천, 국정감사)" autocomplete="off" aria-label="용어 검색">
  <div class="gcats">${GCATS.map(c=>`<button class="gcat ${GCAT===c?'on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class="glist" id="glist"></div></div>`}
function glossList(){const q=($('#gq')?$('#gq').value:'').trim();const l=GLOSS.filter(([c,t,d])=>(GCAT==='전체'||c===GCAT)&&(!q||t.includes(q)||d.includes(q)));
  $('#glist').innerHTML=l.length?l.map(([c,t,d])=>`<div class="gitem"><b>${t}</b><span class="gc">${c}</span><p>${d}</p></div>`).join(''):'<p class="fhint">찾는 용어가 없어요.</p>'}
function bindGloss(){$('#gq').oninput=glossList;document.querySelectorAll('.gcat').forEach(b=>b.onclick=()=>{GCAT=b.dataset.c;document.querySelectorAll('.gcat').forEach(x=>x.classList.toggle('on',x===b));glossList()});glossList()}
let GLPREV=false;
function openGloss(){const m=$('#glm');if(m.classList.contains('show'))return;GLPREV=PAUSED;PAUSED=true;m.classList.remove('hide');m.classList.add('show');
  $('#glcard').innerHTML=`<div class="swap"><div class="head"><div class="ic">📖</div><div><span class="tag">공부하며 플레이하기</span><h2 id="glt">정치 용어 사전</h2></div></div>${glossHtml()}<div class="row2" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="glx">닫기</button></div></div>`;
  bindGloss();$('#glx').onclick=closeGloss}
function closeGloss(){const m=$('#glm');m.classList.add('hide');setTimeout(()=>{m.classList.remove('show','hide');$('#glcard').innerHTML='';PAUSED=GLPREV;LAST=0;if(S&&!ENDING)renderFocus()},300)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#glm').classList.contains('show'))closeGloss()});

/* ================= 의견 보내기 ================= */
const VERSION='베타';
const FEEDBACK_EMAIL='';   // 받을 이메일 주소를 넣으면 ‘메일로 보내기’ 버튼이 생겨요
const FEEDBACK_FORM='';    // 구글 설문지 등 주소를 넣으면 ‘설문지 열기’ 버튼이 생겨요
const FEEDBACK_ENDPOINT='https://script.google.com/macros/s/AKfycbw1KmJA9uoX-T3yI9omrEjOrO_JyrUO-Z3XyVZgK1cl4iIN7TOP61wpO1ULG7-hPw/exec';   // ← 구글 Apps Script 웹 앱 주소(https://script.google.com/macros/s/.../exec)를 따옴표 안에 붙여 넣으세요
function sendFb(){const tn={bug:'버그·오류',fun:'재미있어요',hard:'어렵거나 헷갈려요',idea:'아이디어'}[FB.type]||'기타';
  const body=JSON.stringify({type:tn,star:FB.star||'',text:FB.text.trim(),name:FB.name.trim()||'익명',ctx:fbContext(),ver:VERSION});
  $('#fbgo').disabled=true;$('#fbgo').textContent='보내는 중…';
  const t=new Promise((_,rej)=>setTimeout(()=>rej('timeout'),8000));
  Promise.race([fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}),t]).then(renderFbSent).catch(()=>renderFbDone())}
function renderFbSent(){$('#fbcard').innerHTML=`<div class="swap"><div class="head"><div class="ic">💌</div><div><span class="tag">의견 보내기</span><h2 id="fbt">잘 받았어요!</h2></div></div>
   <p class="tx" style="font-size:15px">소중한 의견 고마워요. 게임을 더 좋게 만드는 데 꼭 참고할게요.</p>
   <div class="row2" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="fbx">닫기</button></div></div>`;$('#fbx').onclick=closeFeedback;$('#fbx').focus({preventScroll:true})}
let FB={type:'',star:0,prev:false};
function fbContext(){if(!S)return'시작 화면';if(ENDING)return`엔딩 (${S.flags.presWin?S.age:S.deathAge}세)`;return`${S.age}세, ${stage()}`}
function openFeedback(){const m=$('#fbm');if(m.classList.contains('show'))return;FB={type:'',star:0,prev:PAUSED};PAUSED=true;
  m.classList.remove('hide');m.classList.add('show');renderFbForm()}
function closeFeedback(){const m=$('#fbm');m.classList.add('hide');setTimeout(()=>{m.classList.remove('show','hide');$('#fbcard').innerHTML='';PAUSED=FB.prev;LAST=0;if(S&&!ENDING)renderFocus()},300);$('#fbbtn').focus({preventScroll:true})}
function renderFbForm(){const types=[['bug','🐞 버그·오류'],['fun','😀 재미있어요'],['hard','🤔 어렵거나 헷갈려요'],['idea','💡 아이디어']];
  $('#fbcard').innerHTML=`<div class="swap"><div class="head"><div class="ic">💬</div><div><span class="tag">태어난 김에 대통령까지 ${VERSION}</span><h2 id="fbt">의견 보내기</h2></div></div>
   <p class="tx" style="font-size:15px">플레이하면서 느낀 점을 알려 주세요. 게임을 더 좋게 만드는 데 쓰여요.</p>
   <div class="fbl">어떤 의견인가요?</div><div class="fbtypes">${types.map(([k,n])=>`<button class="fbt ${FB.type===k?'on':''}" data-k="${k}" aria-pressed="${FB.type===k}">${n}</button>`).join('')}</div>
   <div class="fbl">전체 만족도</div><div class="fbstars" role="group" aria-label="별점">${[1,2,3,4,5].map(n=>`<button class="fbs ${n<=FB.star?'on':''}" data-n="${n}" aria-label="별 ${n}개">★</button>`).join('')}</div>
   <div class="fbl"><label for="fbtext">자세한 내용</label></div><textarea id="fbtext" maxlength="1000" rows="5" placeholder="예) 수능 다음에 선택 창이 두 번 떴어요 / 정치 활동이 너무 어려워요 / 직업이 더 많았으면 좋겠어요">${FB.text||''}</textarea>
   <div class="fbl"><label for="fbname">닉네임 (선택)</label></div><input id="fbname" maxlength="20" value="${FB.name||''}" autocomplete="off">
   <p class="fbctx">함께 전달되는 정보: ${fbContext()}</p>
   <div class="row2" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="fbx">닫기</button><button class="btn" id="fbgo">${FEEDBACK_ENDPOINT?'의견 보내기':'의견 만들기'}</button></div></div>`;
  document.querySelectorAll('.fbt').forEach(b=>b.onclick=()=>{FB.type=b.dataset.k;keep();renderFbForm()});
  document.querySelectorAll('.fbs').forEach(b=>b.onclick=()=>{FB.star=+b.dataset.n;keep();renderFbForm()});
  const keep=()=>{FB.text=$('#fbtext').value;FB.name=$('#fbname').value};
  $('#fbx').onclick=closeFeedback;
  $('#fbgo').onclick=()=>{keep();if(!FB.text.trim()&&!FB.star){$('#fbtext').focus();$('#fbtext').placeholder='내용을 적거나 별점을 골라 주세요.';return}if(FEEDBACK_ENDPOINT)sendFb();else renderFbDone()}}
function fbMessage(){const tn={bug:'버그·오류',fun:'재미있어요',hard:'어렵거나 헷갈려요',idea:'아이디어'}[FB.type]||'기타';
  const d=new Date();return`[태어난 김에 대통령까지 ${VERSION} 의견]
종류: ${tn}
만족도: ${FB.star?'★'.repeat(FB.star)+'☆'.repeat(5-FB.star):'-'}
내용: ${FB.text.trim()||'-'}
닉네임: ${FB.name.trim()||'익명'}
게임 상황: ${fbContext()}
날짜: ${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`}
function renderFbDone(){const msg=fbMessage();
  try{const a=JSON.parse(sGet('taedae_feedback_v1')||'[]');a.push(msg);sSet('taedae_feedback_v1',JSON.stringify(a.slice(-20)))}catch(e){}
  const mail=FEEDBACK_EMAIL?`mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent('[태어난 김에 대통령까지] 의견')}&body=${encodeURIComponent(msg)}`:'';
  $('#fbcard').innerHTML=`<div class="swap"><div class="head"><div class="ic">💌</div><div><span class="tag">의견 보내기</span><h2 id="fbt">고마워요!</h2></div></div>
   <p class="tx" style="font-size:15px">아래 의견을 복사해서, 게임 링크를 보내 준 사람에게 카카오톡이나 문자로 전해 주세요.</p>
   <textarea id="fbout" rows="8" readonly>${msg.replace(/</g,'&lt;')}</textarea>
   <p class="fbctx" id="fbstate" aria-live="polite"></p>
   <div class="row2" style="justify-content:flex-end;margin-top:10px">
    ${FEEDBACK_FORM?`<a class="btn ghost" href="${FEEDBACK_FORM}" target="_blank" rel="noopener">📝 설문지 열기</a>`:''}
    ${mail?`<a class="btn ghost" href="${mail}" target="_blank" rel="noopener">✉️ 메일로 보내기</a>`:''}
    <button class="btn ghost" id="fbx">닫기</button><button class="btn" id="fbcp">📋 복사하기</button></div></div>`;
  $('#fbx').onclick=closeFeedback;
  $('#fbcp').onclick=async()=>{const ta=$('#fbout');let ok=false;try{await navigator.clipboard.writeText(msg);ok=true}catch(e){}
    if(!ok){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(e){}}
    $('#fbstate').textContent=ok?'복사했어요! 이제 메신저에 붙여 넣으면 돼요.':'자동 복사가 막혀 있어요. 위 글상자를 길게 눌러 직접 복사해 주세요.';if(!ok){ta.focus();ta.select()}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#fbm').classList.contains('show'))closeFeedback()});

/* ================= 화면: 타이틀 / 생성 / 도감 ================= */
function titleScreen(){S=null;renderHUD();const sv=sGet(SAVE);let got={};try{got=JSON.parse(sGet(ENDKEY)||'{}')}catch(e){}
  $('#main').innerHTML=`<div class="card title ev"><div class="emblem" aria-hidden="true"></div>
   <h1>태어난 김에<span>대통령까지</span></h1>
   <p>중학교 1학년 교실에서 시작되는 한 사람의 일생. 반장 선거부터 대통령 선거까지, 당신의 선택이 인생을 바꾸고 나라를 바꿉니다.</p>
   <div class="tbtns"><button class="btn" id="nw">새 인생 시작하기</button>${sv?'<button class="btn ghost" id="ld">이어서 하기</button>':''}<button class="btn ghost" id="dx">엔딩 도감 (${Object.keys(got).length}/${Object.keys(END).length})</button></div>
   <div class="meta">한 번의 인생은 약 30분이에요. 진행 상황은 이 브라우저에 자동 저장됩니다.</div></div>`;
  $('#nw').onclick=createScreen;$('#dx').onclick=dexScreen;
  if(sv)$('#ld').onclick=()=>{try{S=JSON.parse(sv);resumeGame()}catch(e){sDel(SAVE);titleScreen()}}}

function createScreen(){renderHUD();let g='m',t=null;
  const names=['김민준','이서연','박지호','최하은','정우진','강지유','조현우','윤서아','한도윤','임채원','오시우','신예린'];
  const T=[['intel','📚','총명함','지능 +12'],['health','💪','튼튼함','체력 +12'],['social','🤝','붙임성','사교 +12'],['civic','⚖️','정의감','시민의식 +12']];
  $('#main').innerHTML=`<div class="card ev"><span class="tag">새 인생</span><h2>어떤 사람으로 태어날까?</h2>
   <div class="field"><label for="nm">이름</label><div class="nrow"><input id="nm" maxlength="8" value="${pick(names)}" autocomplete="off"><button class="btn ghost" id="rnd">무작위</button></div></div>
   <div class="field"><label>성별</label><div class="seg"><button class="opt on" data-g="m">남자</button><button class="opt" data-g="f">여자</button></div></div>
   
   <p class="tx" style="font-size:14px;color:var(--muted)">태어날 지역과 집안 형편은 무작위로 정해져요. 인생은 원래 그런 거니까요.</p>
   <div class="next"><button class="btn" id="born">태어나기</button></div></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#rnd').onclick=()=>{$('#nm').value=pick(names)};
  $('#born').onclick=()=>{const n=($('#nm').value||'').trim()||pick(names);newState(n,g,t);birthScreen()};toTop()}

const GIFT={intel:['공부 머리','책상에 오래 앉아 있지 않아도 이해가 빠르다'],health:['운동 신경','취미로 몸을 움직이기만 해도 체력이 잘 유지된다'],social:['친화력','누구와도 금방 친해진다'],civic:['공동체 감각','남의 일을 내 일처럼 여긴다']};
function giftHtml(){return`<span class="note">🧬 이번 인생의 타고난 성장: <b>${LBL[S.gift]} ⭐</b>(${GIFT[S.gift][0]}: ${GIFT[S.gift][1]}. 집중하지 않아도 조금씩 오른다), <b>${LBL[S.gift2]} ✦</b>(잘 떨어지지 않는다). ${['intel','health','social','civic'].filter(k=>S.apt[k]<1).map(k=>LBL[k]).join(', ')}은(는) 노력한 만큼 조금 덜 오른다.</span>`}
function birthScreen(){const fam=['넉넉한 집안','평범한 집안','형편이 어려운 집안'][S.family];
  const fd=['부모님의 든든한 지원을 받으며 자랐다. 지능 +3, 행복 +4','평범하지만 화목한 가정에서 자랐다. 행복 +3','넉넉하지 않은 환경에서 일찍 철이 들었다. 시민의식 +4, 행복 -3'][S.family];
  renderHUD();
  $('#main').innerHTML=`<div class="card ev"><div class="head"><div class="ic">👶</div><div><span class="tag">탄생</span><h2>${S.region}에서 태어나다</h2></div></div>
   <div class="tx"><b>${fam}</b>의 ${S.gender==='m'?'아들':'딸'}로 태어났다. ${fd}.<br><br>그리고 13년 뒤, ${N('은')} 중학교 교복을 입고 교문 앞에 섰다.
   <span class="note">💡 이제부터 ${N('이')} 살아가는 모습을 지켜보세요. 현실의 약 15초가 인생의 1년처럼 흘러가요. 집중할 것을 최대 2개 골라 두면 그 방향으로 쭉 살아가고, 중요한 순간에는 선택 창이 떠요. 아래 ‘직접 고르는 활동’에서 모은 돈을 쓰거나 정치 활동, 선거 출마를 직접 고를 수도 있어요.</span><span class="note">📊 대한민국 평균 인생: 기대수명 ${S.gender==='m'?'남성 80.8세':'여성 86.6세'}, 대학 취학률 76.3%, 첫 취업까지 11.3개월, 초혼 ${S.gender==='m'?'남성 33.9세':'여성 31.6세'}, 주된 일자리 퇴직 52.9세. 선택과 운에 따라 이보다 나은 삶도, 힘든 삶도 살 수 있어요.</span></div>
   <div class="next"><button class="btn" id="st">중학교 입학하기</button></div></div>`;
  $('#st').onclick=startGame;toTop()}

function dexScreen(){S=null;renderHUD();let got={};try{got=JSON.parse(sGet(ENDKEY)||'{}')}catch(e){}
  $('#main').innerHTML=`<div class="card ev"><span class="tag">엔딩 도감</span><h2>모은 엔딩 ${Object.keys(got).length} / ${Object.keys(END).length}</h2>
   <p class="tx" style="font-size:14.5px;color:var(--muted)">어디에 시간을 쓰고 어떤 선택을 하느냐에 따라 다른 결말을 만날 수 있어요.</p>
   <div class="dex">${Object.entries(END).map(([k,v])=>got[k]?`<div><span class="e">${v.e}</span>${v.t}</div>`:'<div class="lock"><span class="e">❔</span>아직 모르는 인생</div>').join('')}</div>
   <div class="row2"><button class="btn" id="bk">처음으로</button></div></div>`;
  $('#bk').onclick=titleScreen;toTop()}

$('#fbbtn').onclick=openFeedback;$('#glbtn').onclick=openGloss;
titleScreen();
</script>
</body>
</html>
